server:
  port: 8080

spring:
  application:
    name: planificacion-asistencial
  datasource:
    # Persistencia local. Se pueden reemplazar las credenciales/URL con variables de entorno.
    url: "${DB_URL:jdbc:h2:file:./data/planificacion;DB_CLOSE_ON_EXIT=FALSE}"
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      encoding: UTF-8
      mode: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console  (JDBC URL de arriba, user sa, sin clave)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  bot:
    # BLUEPRISM -> modo requerido; SIMULADO queda reservado para pruebas/desarrollo explícito.
    modo: ${APP_BOT_MODO:BLUEPRISM}
    carpeta-entrada: ${BLUEPRISM_INPUT_DIR:./entrada}
    automate-exe: ${BLUEPRISM_AUTOMATE_EXE:C:\Program Files\Blue Prism Limited\Blue Prism Automate\AutomateC.exe}
    proceso: ${BLUEPRISM_PROCESO:Procesar Reporte BUK}
  recalculo:
    intervalo-ms: 15000       # cada cuanto se aplican los cambios PENDIENTES que deje el bot en la BD
